basePath: /
definitions:
  route.BroadcastMessageRequest:
    properties:
      message:
        type: string
    required:
    - message
    type: object
  route.ErrorResponse:
    properties:
      message:
        example: Request failed
        type: string
      success:
        example: false
        type: boolean
    type: object
  route.SendFileRequest:
    properties:
      caption:
        type: string
      file_path:
        type: string
      number:
        type: string
    required:
    - file_path
    - number
    type: object
  route.SendMessageRequest:
    properties:
      message:
        type: string
      number:
        type: string
      store:
        type: boolean
    required:
    - message
    - number
    type: object
  route.SuccessResponse:
    properties:
      data: {}
      message:
        example: Request succeeded
        type: string
      success:
        example: true
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: Gin HTTP API for WhatsApp bot utilities and integrations.
  title: WA AI Agent HTTP API
  version: "1.0"
paths:
  /v1/contact/info/{number}:
    get:
      description: Resolve contact details from a WhatsApp number or full JID (e.g.
        6281234567890, 867051314767696@lid)
      parameters:
      - description: WhatsApp Number or JID
        in: path
        name: number
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/route.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/route.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/route.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/route.ErrorResponse'
      summary: Get WhatsApp contact info
      tags:
      - contact
  /v1/me:
    get:
      description: Return WhatsApp account information of the connected bot
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/route.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/route.ErrorResponse'
      summary: Get self information
      tags:
      - system
  /v1/message/broadcast:
    post:
      consumes:
      - application/json
      description: Send a text message to all saved contacts
      parameters:
      - description: Broadcast message payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/route.BroadcastMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/route.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/route.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/route.ErrorResponse'
      summary: Broadcast a WhatsApp message
      tags:
      - message
  /v1/message/send:
    post:
      consumes:
      - application/json
      description: Send a text message to a specific WhatsApp number
      parameters:
      - description: Send message payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/route.SendMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/route.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/route.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/route.ErrorResponse'
      summary: Send a WhatsApp message
      tags:
      - message
  /v1/message/send-file:
    post:
      consumes:
      - application/json
      description: Send a file message to a specific WhatsApp number
      parameters:
      - description: Send file payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/route.SendFileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/route.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/route.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/route.ErrorResponse'
      summary: Send a WhatsApp file
      tags:
      - message
schemes:
- http
swagger: "2.0"
