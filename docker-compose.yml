services:
  mongo:
    image: mongodb/mongodb-atlas-local:latest
    container_name: wa-agent-atlas
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - atlas_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: wa-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: wa-agent-redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    environment:
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_PASSWORD=
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis

  ollama:
    image: ollama/ollama:latest
    container_name: wa-agent-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  brain:
    build:
      context: .
      dockerfile: brain/Dockerfile
    container_name: wa-agent-brain
    command: ["sh", "-c", "mkdir -p /app/playground/runSubagent && uvicorn app:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_TTL=2592000
      - ANTHROPIC_BASE_URL=http://ollama:11434
      - OLLAMA_BASE_URL=http://ollama:11434
      - GIN_SERVER_HOST=wa-agent
      - GIN_SERVER_PORT=8001
      - RUN_SUBAGENT_DIR=/app/playground/runSubagent
      - DOCUMENT_STORAGE_DIR=/app/uploads/documents
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - agents_data:/app/.agents
      - claude_data:/app/.claude
      - playground_data:/app/playground
      - document_data:/app/uploads/documents

  wa-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wa-ai-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RUN_EMBEDDED_BRAIN=false
      - BRAIN_API_BASE_URL=http://brain:8000
      - GIN_SERVER_HOST=0.0.0.0
      - GIN_SERVER_PORT=8001
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017}
      - WA_SESSION_DSN=file:/app/data/wa_session.db?_pragma=foreign_keys(1)
      - OLLAMA_BASE_URL=http://ollama:11434
      - ANTHROPIC_BASE_URL=http://ollama:11434
      - DOCUMENT_STORAGE_DIR=/app/uploads/documents
    depends_on:
      brain:
        condition: service_started
      mongo:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8001:8001"
    volumes:
      - agents_data:/app/.agents
      - claude_data:/app/.claude
      - wa_session_data:/app/data
      - playground_data:/app/playground
      - document_data:/app/uploads/documents

volumes:
  atlas_data:
  redis_data:
  redisinsight_data:
  wa_session_data:
  ollama_data:
  playground_data:
  document_data:
  agents_data:
  claude_data:
